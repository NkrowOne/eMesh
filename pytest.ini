[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# In parallel (pytest-xdist): each test has its own SQLite file and fake Telegram server. With PostgreSQL the tests
# share one database, so tests/conftest.py keeps them in a single worker.
addopts = -n auto
markers =
    ask_timezone: keep the first-visit timezone question for users (other tests skip it)
filterwarnings =
    ignore::DeprecationWarning
