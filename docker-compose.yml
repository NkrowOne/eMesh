services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: emesh
      POSTGRES_PASSWORD: emesh
      POSTGRES_DB: emesh
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emesh"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://emesh:emesh@db:5432/emesh
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
