<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>eMesh spot (1:1, cut to the music)</title>
<link rel="stylesheet" href="phone.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1080px; overflow: hidden; background: #07050b; }
body { font-family: "Inter", "Segoe UI", "Helvetica Neue", "Noto Color Emoji", "Segoe UI Emoji", "Apple Color Emoji", sans-serif;
  -webkit-font-smoothing: antialiased; color: #fff; }
#stage { position: relative; width: 1080px; height: 1080px; overflow: hidden; background: linear-gradient(160deg, #140d1f 0, #09060f 62%, #0e0818 100%); }
#glow1, #glow2, #glow3 { position: absolute; border-radius: 50%; filter: blur(70px); pointer-events: none; }
#glow1 { width: 620px; height: 620px; background: rgba(53, 196, 106, .30); }
#glow2 { width: 700px; height: 700px; background: rgba(122, 75, 224, .30); }
#glow3 { width: 520px; height: 520px; background: rgba(140, 28, 70, .34); }
#mesh { position: absolute; inset: 0; }
#vignette { position: absolute; inset: 0; pointer-events: none; z-index: 30;
  background: radial-gradient(circle at 50% 50%, transparent 55%, rgba(0, 0, 0, .55) 100%); }
#flash { position: absolute; inset: 0; z-index: 40; pointer-events: none; opacity: 0;
  background: radial-gradient(circle at 50% 46%, #fff 0, rgba(190, 255, 215, .85) 30%, rgba(53, 196, 106, .25) 62%, transparent 82%); }
#shock { position: absolute; z-index: 39; left: 50%; top: 46%; width: 300px; height: 300px; margin: -150px 0 0 -150px; border-radius: 50%;
  border: 6px solid rgba(190, 255, 215, .9); box-shadow: 0 0 60px rgba(53, 196, 106, .8), inset 0 0 60px rgba(53, 196, 106, .5); opacity: 0; pointer-events: none; }
#black { position: absolute; inset: 0; z-index: 60; background: #000; opacity: 0; pointer-events: none; }

/* ---------- brand corner, headline and the working animation of each scene ---------- */
#corner { position: absolute; z-index: 12; left: 56px; top: 52px; height: 62px; padding: 9px 20px; border-radius: 18px; background: #fff;
  box-shadow: 0 12px 34px rgba(0, 0, 0, .5); opacity: 0; }
#corner img { height: 44px; display: block; }
#side { position: absolute; z-index: 10; left: 60px; top: 176px; width: 470px; }
#tag { font-size: 18px; font-weight: 700; letter-spacing: 3px; color: var(--green); display: flex; align-items: center; gap: 12px; }
#tag i { width: 46px; height: 3px; border-radius: 2px; background: var(--green); display: block; }
#head { margin-top: 20px; font-size: 62px; line-height: 1.04; font-weight: 800; letter-spacing: -2px; min-height: 196px; }
#head span { display: inline-block; white-space: pre; will-change: transform; }
#head span.hl { background: linear-gradient(90deg, #a6e86a, #35c46a); -webkit-background-clip: text; background-clip: text; color: transparent; }
#subline { margin-top: 18px; font-size: 27px; line-height: 1.34; color: #c8c2d6; font-weight: 450; }
#viz { position: absolute; z-index: 10; left: 60px; top: 580px; width: 470px; height: 440px; }
.v { position: absolute; inset: 0; opacity: 0; }

/* scene 1: the numbers of the network */
.stat { position: absolute; left: 0; display: flex; align-items: center; gap: 18px; padding: 16px 26px 16px 18px; border-radius: 26px;
  background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .1); }
.stat .ic { width: 62px; height: 62px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 32px;
  background: linear-gradient(140deg, rgba(53, 196, 106, .35), rgba(53, 196, 106, .08)); }
.stat b { font-size: 46px; font-weight: 800; letter-spacing: -1.4px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { display: block; font-size: 19px; color: #b9b3c6; margin-top: 4px; }

/* scene 2 and 5: the mesh grows */
.net { position: absolute; inset: 0; }
.net svg { position: absolute; inset: 0; overflow: visible; }
.node { position: absolute; display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px; border-radius: 30px; white-space: nowrap;
  background: rgba(34, 28, 46, .96); border: 1px solid rgba(255, 255, 255, .14); font-size: 19px; font-weight: 600; max-width: 232px;
  transform-origin: center; box-shadow: 0 10px 24px rgba(0, 0, 0, .4); }
.node .a { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }
.node.new { border-color: var(--green); box-shadow: 0 0 0 4px rgba(53, 196, 106, .22), 0 10px 30px rgba(53, 196, 106, .3); }
.node small { color: #b9b3c6; font-weight: 500; font-size: 15px; }
.node .nm { overflow: hidden; text-overflow: ellipsis; }
.node.wide { max-width: 330px; }
.hub { position: absolute; width: 104px; height: 104px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 5px rgba(255, 255, 255, .14), 0 16px 40px rgba(0, 0, 0, .5); }
.hub img { width: 100%; height: 100%; object-fit: cover; }
.ring { position: absolute; border-radius: 50%; border: 3px solid var(--green); opacity: 0; pointer-events: none; }

/* scene 3: the message */
.post { position: absolute; left: 0; top: 0; width: 430px; border-radius: 26px; overflow: hidden; background: #211c2b;
  border: 1px solid rgba(255, 255, 255, .12); box-shadow: 0 30px 70px rgba(0, 0, 0, .6); transform-origin: 50% 60%; }
.post img { display: block; width: 100%; height: 242px; object-fit: cover; }
.post .tx { padding: 16px 20px 6px; font-size: 19px; line-height: 1.36; color: #e8e4f0; }
.post .tx b { font-size: 22px; display: block; margin-bottom: 4px; color: #fff; }
.post .bt { display: flex; gap: 8px; padding: 10px 16px 16px; }
.post .bt i { flex: 1; font-style: normal; text-align: center; font-size: 16px; font-weight: 700; padding: 11px 6px; border-radius: 12px; white-space: nowrap; }

/* the drop: one message, every channel */
#drop { position: absolute; z-index: 11; inset: 0; opacity: 0; pointer-events: none; }
#droptitle { position: absolute; left: 0; right: 0; top: 54px; text-align: center; font-size: 86px; font-weight: 900; letter-spacing: -3.2px; line-height: 1;
  background: linear-gradient(90deg, #b6f07a, #35c46a 55%, #8be3a8); -webkit-background-clip: text; background-clip: text; color: transparent;
  transform-origin: 50% 50%; }
#dropsub { position: absolute; left: 0; right: 0; top: 150px; text-align: center; font-size: 30px; font-weight: 600; color: #d9d4e6; }
#tiles { position: absolute; left: 540px; top: 236px; width: 440px; height: 660px; perspective: 1400px; }
#tilesin { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateY(-13deg) rotateX(4deg); }
.tile { position: absolute; width: 210px; height: 204px; border-radius: 24px; background: rgba(30, 24, 42, .96); border: 1.5px solid rgba(255, 255, 255, .12);
  padding: 14px; box-shadow: 0 18px 40px rgba(0, 0, 0, .5); transform-origin: center; }
.tile .hd { display: flex; align-items: center; gap: 10px; }
.tile .a { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; flex: 0 0 auto; }
.tile .nm { font-size: 16.5px; font-weight: 700; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .mb { font-size: 13.5px; color: #a9a3b8; margin-top: 2px; }
.tile .ph { position: relative; margin-top: 12px; height: 106px; border-radius: 14px; overflow: hidden; background: rgba(255, 255, 255, .06); }
.tile .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; }
.tile .ok { position: absolute; right: -10px; top: -10px; width: 44px; height: 44px; border-radius: 50%; background: var(--green); color: #05230f;
  font-size: 26px; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 22px rgba(53, 196, 106, .5); transform: scale(0); }
.fly { position: absolute; z-index: 13; width: 96px; height: 54px; margin: -27px 0 0 -48px; border-radius: 10px; overflow: hidden; opacity: 0;
  box-shadow: 0 0 0 2px rgba(255, 255, 255, .85), 0 0 34px rgba(53, 196, 106, .9); }
.fly img { width: 100%; height: 100%; object-fit: cover; display: block; }
#dropcount { position: absolute; left: 520px; width: 500px; top: 918px; text-align: center; font-size: 30px; font-weight: 800; letter-spacing: -.6px; font-variant-numeric: tabular-nums; }
#dropcount em { font-style: normal; color: var(--green); }
#droptail { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; font-size: 46px; font-weight: 900; letter-spacing: -1.4px; opacity: 0; }

/* scene 4: the day, with the time of each message */
.day { position: absolute; left: 0; right: 0; top: 30px; height: 300px; border-radius: 28px; background: rgba(255, 255, 255, .055);
  border: 1px solid rgba(255, 255, 255, .1); }
.day .t { position: absolute; left: 28px; top: 22px; font-size: 20px; font-weight: 700; color: #b9b3c6; letter-spacing: 1px; }
.day .clock { position: absolute; right: 28px; top: 14px; font-size: 40px; font-weight: 800; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
.day .line { position: absolute; left: 34px; right: 34px; top: 210px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .14); }
.day .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 3px; background: linear-gradient(90deg, #a6e86a, #35c46a); }
.day .headp { position: absolute; top: 196px; width: 34px; height: 34px; margin-left: -17px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 7px rgba(53, 196, 106, .35), 0 0 30px rgba(53, 196, 106, .9); }
.day .hr { position: absolute; top: 236px; font-size: 16px; color: #8f899e; transform: translateX(-50%); font-variant-numeric: tabular-nums; }
.slot { position: absolute; top: 84px; width: 104px; margin-left: -52px; text-align: center; transform-origin: 50% 100%; }
.slot img { width: 96px; height: 60px; object-fit: cover; border-radius: 12px; display: block; margin: 0 auto; box-shadow: 0 10px 22px rgba(0, 0, 0, .5); border: 2px solid rgba(255, 255, 255, .2); }
.slot b { display: block; margin-top: 7px; font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
.slot i { position: absolute; right: 0; top: -10px; width: 30px; height: 30px; border-radius: 50%; background: var(--green); color: #05230f; font-style: normal;
  font-weight: 900; font-size: 18px; display: flex; align-items: center; justify-content: center; transform: scale(0); }
.pill { position: absolute; left: 0; top: 352px; padding: 13px 22px; border-radius: 26px; font-size: 21px; font-weight: 700; color: #05230f;
  background: linear-gradient(90deg, #a6e86a, #35c46a); box-shadow: 0 12px 30px rgba(53, 196, 106, .25); white-space: nowrap; }

/* scene 6: the numbers of the day */
.big { position: absolute; left: 0; }
.big b { display: block; font-size: 92px; font-weight: 900; letter-spacing: -4px; line-height: .95; font-variant-numeric: tabular-nums;
  background: linear-gradient(90deg, #b6f07a, #35c46a); -webkit-background-clip: text; background-clip: text; color: transparent; }
.big span { display: block; font-size: 23px; color: #c8c2d6; margin-top: 6px; font-weight: 500; }
.bars { position: absolute; left: 0; right: 0; bottom: 6px; height: 150px; display: flex; align-items: flex-end; gap: 14px; }
.bars i { flex: 1; border-radius: 12px 12px 4px 4px; background: linear-gradient(180deg, #a6e86a, #1f8a4c); transform-origin: 50% 100%; display: block; }

/* ---------- the phone in 3D ---------- */
#cam { position: absolute; z-index: 14; inset: 0; perspective: 1700px; perspective-origin: 50% 46%; pointer-events: none; }
#device { position: absolute; left: 0; top: 0; transform-style: preserve-3d; will-change: transform; opacity: 0; }
#shine { position: absolute; z-index: 95; inset: 0; border-radius: 52px; pointer-events: none; mix-blend-mode: screen;
  background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, .28) 46%, rgba(255, 255, 255, .06) 54%, transparent 66%); background-size: 260% 100%; opacity: .0; }
.col.spot { padding-bottom: 10px; }

/* ---------- intro and outro ---------- */
#words { position: absolute; z-index: 20; left: 0; right: 0; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; text-align: center;
  font-size: 104px; font-weight: 900; letter-spacing: -4px; line-height: 1; padding: 0 70px; opacity: 0; }
#logocard { position: absolute; z-index: 22; left: 50%; top: 50%; width: 640px; margin-left: -320px; padding: 34px 46px; border-radius: 44px; background: #fff;
  box-shadow: 0 40px 110px rgba(0, 0, 0, .6), 0 0 120px rgba(53, 196, 106, .35); opacity: 0; transform-origin: 50% 50%; overflow: hidden; }
#logocard img { width: 100%; display: block; }
#logocard::after { content: ""; position: absolute; top: 0; bottom: 0; width: 46%; left: var(--sweep, -60%);
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .95), transparent); transform: skewX(-18deg); }
#tagline { position: absolute; z-index: 21; left: 0; right: 0; text-align: center; font-size: 38px; font-weight: 700; letter-spacing: -.8px; opacity: 0; }
#tagline2 { position: absolute; z-index: 21; left: 0; right: 0; text-align: center; font-size: 27px; color: #c8c2d6; opacity: 0; padding: 0 150px; line-height: 1.35; }
#outro { position: absolute; z-index: 21; inset: 0; opacity: 0; text-align: center; }
#outro h1 { position: absolute; left: 0; right: 0; top: 566px; font-size: 76px; font-weight: 900; letter-spacing: -3px; line-height: 1; }
#outro .cta { position: absolute; left: 50%; top: 690px; transform: translateX(-50%); padding: 22px 44px; border-radius: 44px; font-size: 32px; font-weight: 800;
  color: #05230f; background: linear-gradient(90deg, #a6e86a, #35c46a); box-shadow: 0 18px 46px rgba(53, 196, 106, .35); white-space: nowrap; }
#outro .by { position: absolute; left: 0; right: 0; top: 856px; display: flex; align-items: center; justify-content: center; gap: 20px; font-size: 29px; color: #c8c2d6; font-weight: 500; }
#outro .by span { background: #fff; border-radius: 18px; padding: 10px 20px; display: inline-flex; box-shadow: 0 12px 30px rgba(0, 0, 0, .5); }
#outro .by img { height: 60px; display: block; }
</style>
</head>
<body>
<div id="stage">
  <div id="glow1"></div><div id="glow2"></div><div id="glow3"></div>
  <canvas id="mesh" width="1080" height="1080"></canvas>
  <div id="corner"><img src="assets/logo.png" alt=""></div>
  <div id="side"><div id="tag"><i></i><span></span></div><div id="head"></div><div id="subline"></div></div>
  <div id="viz"></div>
  <div id="drop">
    <div id="droptitle"></div><div id="dropsub"></div>
    <div id="tiles"><div id="tilesin"></div></div>
    <div id="dropcount"></div><div id="droptail"></div>
  </div>
  <div id="cam"><div id="device"><div id="phone">
    <div id="status"><span>9:41</span><span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.6l2.6-2.7a3.7 3.7 0 00-5.2 0zM3.6 7.1a6.2 6.2 0 018.8 0l1.5-1.5a8.3 8.3 0 00-11.8 0zM.8 4.2a10.2 10.2 0 0114.4 0L16 3.4A11.3 11.3 0 000 3.4z"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#fff" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2"/><path d="M25 4.5v4a2 2 0 000-4z" opacity=".4"/></svg>
    </span></div>
    <div id="island"></div>
    <div id="screens"></div>
    <div id="finger"></div>
    <div id="shine"></div>
    <div id="homebar"></div>
  </div></div></div>
  <div id="flies"></div>
  <div id="words"></div>
  <div id="logocard"><img src="assets/logo.png" alt=""></div>
  <div id="tagline"></div><div id="tagline2"></div>
  <div id="outro"><h1></h1><div class="cta"></div><div class="by"><em style="font-style:normal"></em><span><img src="assets/esoft.png" alt=""></span></div></div>
  <div id="vignette"></div><div id="shock"></div><div id="flash"></div><div id="black"></div>
</div>
<script>
"use strict";
// The spot is a pure function of time: draw(t) sets everything for the second `t` of the music, so any frame can be
// rendered on its own. The times below are the music's: 150 bpm, bars every 1.6 s from 0.76 s, and its big hits.
const $ = (sel, root = document) => root.querySelector(sel);
const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const ease = (p) => (p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);
const outC = (p) => 1 - Math.pow(1 - p, 3);
const back = (p) => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };  // overshoots, then settles
const decay = (t, at, k = 6) => (t < at ? 0 : Math.exp(-k * (t - at)));
const fmtN = (n) => Math.round(n).toLocaleString("es-ES").replace(/ /g, ".");
const initials = (name) => name.replace(/[^\p{L}\p{N} ]/gu, "").split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
const GRAD = ["linear-gradient(180deg,#ffbf6d,#fa8a3d)", "linear-gradient(180deg,#a695e7,#6f61e8)", "linear-gradient(180deg,#72d5fd,#2a9ef1)",
  "linear-gradient(180deg,#ff8a8a,#ea5050)", "linear-gradient(180deg,#6ce5c7,#26b8a4)", "linear-gradient(180deg,#f7a8d8,#d1508f)"];
const CHECKS = '<svg width="16" height="11" viewBox="0 0 16 11" fill="none" stroke="#d8c9ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6l3 3 6-7"/><path d="M6.5 8.7l.8.8 6-7"/></svg>';
const ARROW = '<svg class="arr" viewBox="0 0 8 8" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"><path d="M2 6l4.5-4.5M3 1.5h3.5V5"/></svg>';
const BACK = '<svg viewBox="0 0 13 22" fill="none" stroke="#6ab3ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2L2 11l9 9"/></svg>';

let D, UI, M, TXT;
// ------------------------------------------------------------------ the music
const env = (name, t) => { const a = M[name]; const i = clamp(Math.round(t * M.fps), 0, a.length - 1); return a[i]; };
const T = { logo: 6.2, logoMove: 10.36, s1: 11.96, s2: 18.36, added: 25.5, post: 26.36, roll: 28.17, drop: 30.56, dropTail: 35.18, s4: 37.18, s5: 40.36,
  s6: 43.56, outro: 46.76, end: 50.04 };
const FLASH = [[T.logo, .95], [T.s1, .5], [T.s2, .22], [T.added, .55], [T.drop, 1], [T.dropTail, .4], [T.s4, .5], [T.s5, .25], [T.s6, .25], [T.outro, .85]];

// ------------------------------------------------------------------ texts of the spot
const TEXTS = {
  es: {
    words: ["Un mensaje.", "Todos tus canales.", "A la vez."],
    tagline: "Tu red de distribución en Telegram", tagline2: "Escribes una vez. eMesh lo publica en toda tu red, a su hora.",
    scenes: {
      s1: { tag: "01 · TU RED", head: "Toda tu red, de un |vistazo", sub: "Canales, miembros y mensajes activos en una sola pantalla." },
      s2: { tag: "02 · CANALES", head: "Añade canales en |dos toques", sub: "El bot entra como administrador y el canal queda en la red." },
      s3: { tag: "03 · MENSAJES", head: "Escribe |una vez…", sub: "Texto, foto o vídeo, con botones de colores." },
      s4: { tag: "04 · HORARIOS", head: "Cada mensaje, |a su hora", sub: "Se publica automáticamente a la hora que elijas, todos los días." },
      s5: { tag: "05 · ASOCIADOS", head: "Tus asociados |suman canales", sub: "Piden unirse y tú decides. Sus canales entran en tu red." },
      s6: { tag: "06 · RESULTADOS", head: "Mide |cada envío", sub: "Entregados, fallos y alcance real, al momento." },
    },
    stats: [["📣", 5, "canales en tu red"], ["👤", 51300, "personas"], ["📝", 3, "mensajes activos"]],
    dropTitle: "…publica en todos", dropSub: "Un toque. Sale en toda la red.", dropCount: ["canales", "personas"], dropTail: "Un toque. Toda tu red.",
    day: "HOY", dayPill: "⏰ Automático, sin que hagas nada", partnerPill: "🤝 Aceptado: ya recibe tus mensajes",
    big: [[19, "mensajes entregados hoy"], [199935, "personas alcanzadas"]],
    outro: "Crea tu red en un minuto", cta: "Búscalo en Telegram: eMesh", by: "una app de",
  },
};

// ------------------------------------------------------------------ Telegram inside the phone
function linkify(html) {
  return html.split(/(<[^>]+>)/).map((part) => part.startsWith("<") ? part :
    part.replace(/(https?:\/\/[^\s<]+|t\.me\/[^\s<]+|@[A-Za-z][A-Za-z0-9_]{3,})/g, '<span class="lnk">$1</span>')).join("");
}
function kbHtml(kb) {
  if (!kb || !kb.length) return "";
  return `<div class="kb">` + kb.map((row) => `<div class="r${row.length >= 3 ? " n3" : ""}">` + row.map((b) =>
    `<div class="k${b.style ? " " + b.style : ""}" data-t="${esc(b.text)}"><span>${esc(b.text)}</span>${b.url ? ARROW : ""}</div>`).join("") + `</div>`).join("") + `</div>`;
}
function bubble(st, meta) {

    const card = $('#viz [data-k="s3"] .post'); const p = seg(t, a + .5, a + 1.0), charge = seg(t, T.roll, T.drop);
    const shake = charge * env("flux", t);
    card.style.opacity = p; card.style.transform = `perspective(900px) translateY(${(1 - outC(p)) * 70 - 26}px) rotateX(${(1 - outC(p)) * 28}deg) rotateZ(${-2 + shake * 2.4 * Math.sin(t * 60)}deg) scale(${.96 + .05 * charge + .02 * shake})`;
    card.style.boxShadow = `0 30px 70px rgba(0,0,0,.6), 0 0 ${20 + 90 * charge}px rgba(53,196,106,${.15 + .6 * charge})`;
  },
  s4(t, a, b) {
    const root = $('#viz [data-k="s4"]'); const p = seg(t, a + .5, b - .35), hour = 8 + 16 * p, x = 34 + p * 402;
    pop($(".day", root), t, a + .1, .4); $(".day", root).style.transformOrigin = "0 0";
    $(".fill", root).style.width = (p * 100) + "%"; $(".headp", root).style.left = x + "px";
    $(".headp", root).style.transform = `scale(${1 + .25 * env("low", t)})`;
    $(".clock", root).textContent = `${String(Math.floor(hour) % 24).padStart(2, "0")}:${String(Math.floor((hour % 1) * 60 / 5) * 5).padStart(2, "0")}`;
    root.querySelectorAll(".slot").forEach((s) => { const h = +s.dataset.h.slice(0, 2) + (+s.dataset.h.slice(3)) / 60; const hit = a + .5 + (h - 8) / 16 * (b - .35 - a - .5);
      const done = seg(t, hit, hit + .35); s.style.opacity = .45 + .55 * clamp(done * 3);
      s.style.transform = `translateY(${-14 * Math.sin(Math.PI * done)}px) scale(${1 + .16 * Math.sin(Math.PI * done)})`; $("i", s).style.transform = `scale(${done > 0 ? back(done) : 0})`; });
    const pl = $(".pill", root), pp = seg(t, a + 1.6, a + 2.0); pl.style.opacity = pp; pl.style.transform = `translateX(${(1 - outC(pp)) * -20}px)`;
  },
  s5(t, a) {
    const root = $('#viz [data-k="s5"]'); const join = a + 1.2, p = seg(t, a + .35, join), q = outC(p);  // it docks when ✅ Aceptar is pressed
    const n = $('.node[data-p="2"]', root); const x = lerp(-90, 62, q), y = lerp(330, 232, q);
    n.style.left = x + "px"; n.style.top = y + "px"; n.style.opacity = seg(t, a + .3, a + .6); n.style.transform = `scale(${1 + .1 * decay(t, join, 4)})`;
    n.classList.toggle("new", t >= join);
    root.querySelectorAll('.node[data-p="0"], .node[data-p="1"]').forEach((m, i) => pop(m, t, a + .15 + i * .2, .34));
    const j = outC(seg(t, join, join + .4));
    $("svg", root).innerHTML = line(null, 235, 92, 100, 142, 1, "rgba(150,140,190,.5)") + line(null, 235, 92, 344, 142, 1, "rgba(150,140,190,.5)")
      + line(null, 235, 92, 235, 236, j, "rgba(166,232,106,1)");
    const ring = $(".ring", root), rp = seg(t, join, join + .7), s = 60 + 240 * outC(rp);
    setRing(ring, 225, 268, s, rp > 0 ? 1 - rp : 0);
    const pl = $(".pill", root), pp = seg(t, join + .1, join + .5); pl.style.opacity = pp; pl.style.transform = `translateX(${(1 - outC(pp)) * -20}px)`;
  },
  s6(t, a) {
    const root = $('#viz [data-k="s6"]');
    root.querySelectorAll(".big").forEach((n, i) => { const at = a + .3 + i * .8; const p = seg(t, at, at + .3);
      n.style.opacity = p; n.style.transform = `translateY(${(1 - outC(p)) * 30}px)`; $("b", n).textContent = fmtN(TXT.big[i][0] * outC(seg(t, at, at + 1.1))); });
    const H = [.34, .5, .42, .66, .58, .82, 1];
    root.querySelectorAll(".bars i").forEach((n, i) => { const at = a + .8 + i * .2; n.style.height = (150 * H[i]) + "px";
      n.style.transform = `scaleY(${outC(seg(t, at, at + .5)) * (1 + .07 * env("low", t))})`; });
  },
};

// ------------------------------------------------------------------ the drop: the message flies to every channel
const TILE_AT = (i) => T.drop + .6 + i * .4;  // one channel every beat
function buildDrop() {
  $("#droptitle").textContent = TXT.dropTitle; $("#dropsub").textContent = TXT.dropSub; $("#droptail").textContent = TXT.dropTail;
  $("#tilesin").innerHTML = D.channels.map((c, i) => `<div class="tile" style="left:${(i % 2) * 230}px;top:${Math.floor(i / 2) * 228}px">
    <div class="hd"><div class="a" style="background:${GRAD[i % 6]}">${esc(initials(c.name))}</div><div style="min-width:0"><div class="nm">${esc(c.name)}</div><div class="mb">👤 ${fmtN(c.members)}</div></div></div>
    <div class="ph"><img src="${D.states.channel.photo}"></div><div class="ok">✓</div></div>`).join("");
  $("#flies").innerHTML = D.channels.map(() => `<div class="fly"><img src="${D.states.channel.photo}"></div>`).join("");
}
function drawDrop(t) {
  const d = $("#drop"); const on = seg(t, T.drop - .02, T.drop + .1) * (1 - seg(t, T.s4 - .3, T.s4));
  d.style.opacity = on; const flies = [...$("#flies").children];
  if (on <= 0) { flies.forEach((f) => { f.style.opacity = 0; }); return; }
  const slam = seg(t, T.drop, T.drop + .42);
  $("#droptitle").style.transform = `scale(${lerp(2.3, 1, outC(slam)) * (1 + .03 * env("low", t))})`; $("#droptitle").style.opacity = clamp(slam * 3);
  const sp = seg(t, T.drop + .8, T.drop + 1.2); $("#dropsub").style.opacity = sp * (1 - seg(t, T.dropTail - .2, T.dropTail));
  const phone = $("#phone").getBoundingClientRect(), stage = $("#stage").getBoundingClientRect();
  const sx = phone.left - stage.left + phone.width / 2, sy = phone.top - stage.top + phone.height * .52;
  const tiles = [...document.querySelectorAll("#tilesin .tile")]; let done = 0, people = 0;
  tiles.forEach((tile, i) => {
    const at = TILE_AT(i), appear = seg(t, T.drop + .15 + i * .07, T.drop + .5 + i * .07), got = seg(t, at, at + .4);
    const wave = seg(t, 34.5, T.s4) > 0 ? .05 * env("flux", t) * (.5 + .5 * Math.sin(t * 20 + i)) : 0;
    tile.style.opacity = appear; tile.style.transform = `translateZ(${(1 - outC(appear)) * -260 + 46 * Math.sin(Math.PI * clamp(got))}px) scale(${1 + .08 * decay(t, at, 5) + wave})`;
    tile.style.borderColor = got > 0 ? "rgba(53,196,106,.9)" : "rgba(255,255,255,.12)";
    tile.style.boxShadow = `0 18px 40px rgba(0,0,0,.5), 0 0 ${got > 0 ? 34 * (1 - .6 * seg(t, at, at + 1.2)) : 0}px rgba(53,196,106,.8)`;
    $(".ph img", tile).style.opacity = got; $(".ok", tile).style.transform = `scale(${got > 0 ? back(got) : 0})`;
    if (t >= at) { done++; people += D.channels[i].members; }
    const f = flies[i], fp = seg(t, at - .42, at);  // the copy leaves the phone and lands on the beat
    if (fp > 0 && fp < 1) { const r = tile.getBoundingClientRect(), ex = r.left - stage.left + r.width / 2, ey = r.top - stage.top + r.height * .62, e = ease(fp);
      f.style.opacity = 1; f.style.left = lerp(sx, ex, e) + "px"; f.style.top = (lerp(sy, ey, e) - 150 * Math.sin(Math.PI * e)) + "px";
      f.style.transform = `scale(${lerp(.5, 1.5, Math.sin(Math.PI * e))}) rotate(${lerp(-24, 8, e)}deg)`; } else f.style.opacity = 0;
  });
  const cp = seg(t, T.drop + .5, T.drop + .8);
  $("#dropcount").style.opacity = cp; $("#dropcount").innerHTML = `<em>${done} / ${tiles.length}</em> ${TXT.dropCount[0]} · <em>${fmtN(people)}</em> ${TXT.dropCount[1]}`;
  const tp = seg(t, T.dropTail, T.dropTail + .4), tail = $("#droptail");
  tail.style.opacity = clamp(tp * 3); tail.style.transform = `scale(${lerp(1.7, 1, outC(tp)) * (1 + .04 * env("flux", t) * seg(t, 34.5, T.s4))})`;
}

// ------------------------------------------------------------------ intro, outro and the flashes on the hits
function drawCovers(t) {
  const w = $("#words"); const bars = [.76, 2.36, 3.96, 5.5]; let k = -1; for (let i = 0; i < 3; i++) if (t >= bars[i] && t < bars[i + 1]) k = i;
  if (k < 0) w.style.opacity = 0; else {
    if (w.dataset.k !== String(k)) { w.dataset.k = String(k); w.textContent = TXT.words[k]; }
    const p = seg(t, bars[k], bars[k] + .34), o = 1 - seg(t, bars[k + 1] - .2, bars[k + 1]);
    w.style.opacity = p * o; w.style.transform = `scale(${lerp(1.5, 1, outC(p)) + .05 * (t - bars[k])})`; w.style.filter = `blur(${(1 - p) * 14}px)`;
    w.style.color = k === 2 ? "#7be29a" : "#fff";
  }
  // the logo: lands on the first hit, then goes to its corner while the phone comes in; it comes back to close
  const card = $("#logocard"), inA = seg(t, T.logo, T.logo + .5), toCorner = ease(seg(t, T.logoMove, T.logoMove + .9)), outroIn = seg(t, T.outro, T.outro + .5);
  const showA = inA > 0 && t < T.outro - .5;
  if (showA) { const s = lerp(back(inA), .25, toCorner), x = lerp(0, -350, toCorner), y = lerp(-70, -458, toCorner);
    card.style.opacity = 1 - seg(t, T.logoMove + .7, T.logoMove + .9); card.style.transform = `translate(${x}px, ${y - 100}px) scale(${s})`;
    card.style.setProperty("--sweep", `${lerp(-60, 130, seg(t, T.logo + .25, T.logo + 1.15))}%`); }
  else if (outroIn > 0) { card.style.opacity = 1; card.style.transform = `translate(0px, ${-250 - 100}px) scale(${back(outroIn) * .92})`;
    card.style.setProperty("--sweep", `${lerp(-60, 130, seg(t, T.outro + .25, T.outro + 1.1))}%`); }
  else card.style.opacity = 0;
  $("#corner").style.opacity = seg(t, T.logoMove + .7, T.logoMove + .95) * (1 - seg(t, T.outro - .3, T.outro))
    * (1 - seg(t, T.drop - .15, T.drop) + seg(t, T.s4 - .1, T.s4 + .2));
  const tg = $("#tagline"), p1 = seg(t, 7.16, 7.6) * (1 - seg(t, T.logoMove - .1, T.logoMove + .2));
  tg.style.top = "610px"; tg.style.opacity = p1; tg.style.transform = `translateY(${(1 - outC(seg(t, 7.16, 7.6))) * 24}px)`;
  const tg2 = $("#tagline2"), p2 = seg(t, 8.76, 9.2) * (1 - seg(t, T.logoMove - .1, T.logoMove + .2));
  tg2.style.top = "676px"; tg2.style.opacity = p2; tg2.style.transform = `translateY(${(1 - outC(seg(t, 8.76, 9.2))) * 20}px)`;
  const o = $("#outro"); o.style.opacity = seg(t, T.outro, T.outro + .2);
  const h = $("h1", o), hp = seg(t, T.outro + .4, T.outro + .8); h.style.opacity = hp; h.style.transform = `translateY(${(1 - outC(hp)) * 30}px)`;
  const c = $(".cta", o), cp = seg(t, T.outro + 1.2, T.outro + 1.6); c.style.opacity = cp;
  c.style.transform = `translateX(-50%) scale(${(cp > 0 ? back(cp) : 0) * (1 + .03 * Math.sin(t * 7))})`;
  const by = $(".by", o), bp = seg(t, T.outro + 1.6, T.outro + 2.0); by.style.opacity = bp; by.style.transform = `translateY(${(1 - outC(bp)) * 16}px)`;
  $("#flash").style.opacity = clamp(FLASH.reduce((s, [at, amp]) => s + amp * decay(t, at, 7.5), 0), 0, .92);
  $("#black").style.opacity = seg(t, 49.55, T.end - .02);
  // a ring of light leaves the centre on the three big hits, and the whole picture gives a small push on every hit
  const sh = $("#shock"); let sp = 0, big = 0; for (const at of [T.logo, T.drop, T.outro]) if (t >= at && t < at + .9) { sp = (t - at) / .9; big = at === T.drop ? 1 : .7; }
  sh.style.opacity = sp > 0 ? (1 - sp) * big : 0; sh.style.transform = `scale(${.4 + 5.5 * outC(sp)})`;
  const punch = FLASH.reduce((s, [at, amp]) => s + amp * decay(t, at, 9), 0);
  $("#stage").style.transform = `scale(${1 + .035 * punch + .006 * env("low", t)})`;
}

function draw(t) { drawMesh(t); drawPhone(t); drawPose(t); drawSide(t); drawDrop(t); drawCovers(t); return t >= T.end; }
window.__load = (data, music) => {
  D = data; UI = data.ui; M = music; TXT = TEXTS[data.lang] || TEXTS.es;
  $("#tagline").textContent = TXT.tagline; $("#tagline2").textContent = TXT.tagline2;
  $("#outro h1").textContent = TXT.outro; $("#outro .cta").textContent = TXT.cta; $("#outro .by em").textContent = TXT.by;
  views = VIEWS(); buildViz(); buildDrop(); draw(0);
  return T.end;
};
window.__frame = (t) => draw(t);
</script>
